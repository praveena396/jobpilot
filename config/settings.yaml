job_search:
  match_threshold: 55  # 0-100, see jobpilot/matching.py for how it's scored
  # Jobs whose description couldn't be fetched can't earn skill points; an entry-level
  # title in your target roles scores 40, so this keeps them without letting junk in.
  match_threshold_title_only: 40
  max_descriptions: 300       # descriptions to fetch per scan from Workday/Greenhouse/Lever/...
  # Job titles containing any of these are never shown
  exclude_title_keywords: ["java", ".net", "c#", "php", "ios", "android", "flutter", "angular",
                           "qa", "tester", "test engineer",
                           "sdet", "sap", "network", "hardware", "embedded", "mechanical",
                           "electrical", "civil", "sales", "support", "analyst", "recruiter",
                           "consultant", "technician", "mainframe", "manager", "director"]
  max_applications_per_day: 50  # daily target used by `jobpilot today`
  # --- New grad / entry-level focus ---
  default_location: "usa"     # used by `jobpilot today` with no location (usa/india/bangalore/all)
  entry_level_only: true      # drop senior/staff/manager roles
  new_grad_only: true         # only roles that say new grad / graduate / early career /
                              # entry level / recent grads (title or description)
  hide_ineligible_grad_years: true  # hide "Class of 2026", "2027 Start", "currently enrolled" roles
  max_years_experience: 2     # drop roles asking for more than this
  include_internships: false
  max_age_days: 21            # only jobs posted in the last N days (3 weeks)
  queue_max_age_days: 21      # how long unapplied jobs stay in `jobpilot today`
  linkedin:
    experience_levels: [2, 3]  # 1=Internship 2=Entry level 3=Associate 4=Mid-Senior
    max_roles: 8               # how many job_titles to search on LinkedIn
    pages_per_search: 3
    # Extra LinkedIn searches (in addition to job_titles) aimed at new grad postings
    keywords:
      - "new grad software engineer"
      - "new grad machine learning engineer"
      - "new grad AI engineer"
      - "university graduate software engineer"
      - "early career software engineer"
      - "entry level AI engineer"
      - "recent graduate software engineer"
    max_descriptions: 200  # job descriptions to fetch per scan (for skill matching)
  # Extra company job boards (slug from the board URL), added to the built-in lists
  greenhouse_companies: []    # boards.greenhouse.io/<slug>
  lever_companies: []         # jobs.lever.co/<slug>
  ashby_companies: []         # jobs.ashbyhq.com/<slug>
  min_company_stage: "series_c"
  check_interval_minutes: 30
  sources:
  - "linkedin"
  - "wellfound"
  - "instahyre"
  - "cutshort"
  - "naukri"
  - "hirist"
  - "indeed"
  - "greenhouse"
  - "lever"
  - "yc_jobs"
  - "company_careers"


# JobPilot Configuration
# Copy to config/settings.yaml and fill in your details

profile:
  linkedin_url: ""
  target_level: "L3"  # L3/L4/L5/L6/L7 (L3 = new grad / entry level)
  target_roles:
    - "Backend Engineer"
    - "Platform Engineer"
    - "Software Engineer"
  tech_stack:
    - "Python"
    - "Go"
    - "Kubernetes"
    - "AWS"
    - "PostgreSQL"
  target_companies:
    - "Google"
    - "Meta"
    - "Apple"
    - "Amazon"
    - "Netflix"
    - "Microsoft"
    - "Stripe"
    - "Databricks"
    - "OpenAI"
    - "Anthropic"
  salary_floor_usd: 200000
  location: "remote"  # remote / hybrid / onsite
  visa_sponsorship_needed: false
  visa_status: "citizen"  # citizen / pr / h1b / need_sponsorship
  availability: "2 weeks notice"
  portfolio:
    github: ""
    website: ""
    publications: []
  achievements: []
  education: []
  certifications: []

  # --- Resume-based matching ---
  resume_path: ""          # optional: path to your resume (.pdf/.docx/.txt)
  graduation_date: ""      # "YYYY-MM" — hides new grad roles meant for other classes
  core_skills: []          # e.g. ["Python", "PyTorch", "FastAPI"] (see SKILL_VOCAB in matching.py)
  focus_keywords: []       # title words for your area, e.g. ["backend", "ml", "ai"]

job_search:
  match_threshold: 55  # 0-100, see jobpilot/matching.py for how it's scored
  # Jobs whose description couldn't be fetched can't earn skill points; an entry-level
  # title in your target roles scores 40, so this keeps them without letting junk in.
  match_threshold_title_only: 40
  max_descriptions: 300       # descriptions to fetch per scan from Workday/Greenhouse/Lever/...
  # Job titles containing any of these are never shown
  exclude_title_keywords: []  # e.g. ["java", "frontend", "sales", "manager"]
  max_applications_per_day: 50  # daily target used by `jobpilot today`
  # --- New grad / entry-level focus ---
  default_location: "all"     # used by `jobpilot today` with no location (usa/india/bangalore/all)
  entry_level_only: true      # drop senior/staff/manager roles
  hide_ineligible_grad_years: true  # hide "Class of 2026", "2027 Start", "currently enrolled" roles
  max_years_experience: 2     # drop roles asking for more than this
  include_internships: false
  max_age_days: 3             # only jobs posted in the last N days (up to 7 for more)
  queue_max_age_days: 7       # how long unapplied jobs stay in `jobpilot today`
  linkedin:
    experience_levels: [2, 3]  # 1=Internship 2=Entry level 3=Associate 4=Mid-Senior
    max_roles: 8               # how many job_titles to search on LinkedIn
    pages_per_search: 3
    max_descriptions: 120  # job descriptions to fetch per scan (for skill matching)
  # Extra company job boards (slug from the board URL), added to the built-in lists
  greenhouse_companies: []    # boards.greenhouse.io/<slug>
  lever_companies: []         # jobs.lever.co/<slug>
  ashby_companies: []         # jobs.ashbyhq.com/<slug>
  min_company_stage: "series_c"  # series_c / public / revenue_100m
  check_interval_minutes: 30
  sources:
    - "linkedin"
    - "greenhouse"
    - "lever"
    - "company_careers"
  blacklisted_companies: []

resume:
  max_pages_junior: 1   # L3-L4
  max_pages_senior: 2   # L5+
  ats_target_score: 90
  output_dir: "output/resumes"

notifications:
  enabled: true
  method: "telegram"  # telegram / email / desktop
  telegram:
    bot_token: ""
    chat_id: ""
  email:
    smtp_host: ""
    smtp_port: 587
    username: ""
    password: ""
    to_address: ""
  auto_apply_delay_minutes: 30  # wait before auto-applying

ai:
  provider: "openai"  # openai / anthropic / local
  api_key: ""
  model: "gpt-4o"
  temperature: 0.3

database:
  path: "data/jobpilot.db"

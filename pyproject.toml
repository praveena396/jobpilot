[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jobpilot*"]

[project]
name = "jobpilot"
version = "1.0.0"
description = "AI Job Auto-Apply Agent — scrape, match, generate resumes, auto-apply"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "playwright>=1.40",
    "beautifulsoup4>=4.12",
    "httpx>=0.25",
    "python-docx>=1.1",
    "pyyaml>=6.0",
    "rich>=13.7",
    "typer>=0.9",
    "pydantic>=2.5",
    "jinja2>=3.1",
    "schedule>=1.2",
    "sqlite-utils>=3.36",
    "python-telegram-bot>=20.7",
    "openai>=1.6",
    "fake-useragent>=1.4",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest", "pytest-asyncio"]

[project.scripts]
jobpilot = "jobpilot.cli:app"
jobpilot-match = "jobpilot.analyzer.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "S", "B"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
